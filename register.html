<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — BAMS</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="shell">
    <a href="index.html" class="brand">
      <span class="brand-mark">BAMS</span>
      <span class="brand-tag">SEU · Oluvil</span>
    </a>
    <nav class="site-nav" id="site-nav">
      <a href="index.html">Browse</a>
      <a href="my-inquiries.html" data-nav="inquiries">My Inquiries</a>
      <a href="provider-dashboard.html" data-nav="provider">Provider Dashboard</a>
      <a href="admin.html" data-nav="admin">Admin</a>
    </nav>
    <span id="auth-slot"></span>
  </div>
</header>

<div class="shell">
  <div class="auth-wrap">
    <div class="auth-card">
      <p class="auth-eyebrow">Create an account</p>
      <h1>Register for BAMS</h1>

      <div class="auth-error" id="auth-error"></div>

      <form id="register-form">
        <div class="field">
          <label for="reg-name">Full name</label>
          <input type="text" id="reg-name" required />
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" required />
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required minlength="6" />
        </div>
        <div class="field">
          <label for="reg-confirm">Confirm password</label>
          <input type="password" id="reg-confirm" required minlength="6" />
        </div>

        <div class="field">
          <label class="group-label" style="margin-bottom:8px; display:block;">I am registering as a</label>
          <div class="role-toggle">
            <label>
              <input type="radio" name="role" value="student" checked />
              <span>Student</span>
            </label>
            <label>
              <input type="radio" name="role" value="provider" />
              <span>Boarding Provider</span>
            </label>
          </div>
        </div>

        <button type="submit" class="btn" style="width:100%;">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="shell">BAMS — Final Year Project, MIT-PR01 · SEU/IS/21/MIT/151</div>
</footer>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/header.js"></script>
<script>
  document.getElementById("register-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("auth-error");
    errorBox.classList.remove("show");

    const name = document.getElementById("reg-name").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const password = document.getElementById("reg-password").value;
    const confirm = document.getElementById("reg-confirm").value;
    const role = document.querySelector('input[name="role"]:checked').value;

    if (password !== confirm) {
      errorBox.textContent = "Passwords don't match.";
      errorBox.classList.add("show");
      return;
    }

    const result = registerUser({ name, email, password, role });

    if (!result.ok) {
      errorBox.textContent = result.error;
      errorBox.classList.add("show");
      return;
    }

    // Send each role to their own home base.
    if (role === "provider") {
      window.location.href = "provider-dashboard.html";
    } else {
      window.location.href = "index.html";
    }
  });
</script>
</body>
</html>
