<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel — BAMS</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="shell">
    <a href="index.html" class="brand">
      <span class="brand-mark">BAMS</span>
      <span class="brand-tag">SEU · Oluvil</span>
    </a>
    <nav class="site-nav" id="site-nav">
      <a href="index.html">Browse</a>
      <a href="my-inquiries.html" data-nav="inquiries">My Inquiries</a>
      <a href="provider-dashboard.html" data-nav="provider">Provider Dashboard</a>
      <a href="admin.html" data-nav="admin" class="active">Admin</a>
    </nav>
    <span id="auth-slot"></span>
  </div>
</header>

<div class="shell">
  <div class="dash-header">
    <div>
      <h1>Admin Panel</h1>
      <p>Verify listings, manage accounts, and keep an eye on system activity.</p>
    </div>
  </div>

  <div style="padding: 28px 0 60px;">

    <section class="admin-section">
      <p class="admin-section-title">
        <span>Pending listing approvals</span>
        <span class="count" id="pending-count">0</span>
      </p>
      <div class="admin-list" id="pending-list"></div>
    </section>

    <section class="admin-section">
      <p class="admin-section-title">
        <span>All listings</span>
        <span class="count" id="all-listings-count">0</span>
      </p>
      <div class="admin-list" id="all-listings-list"></div>
    </section>

    <section class="admin-section">
      <p class="admin-section-title">
        <span>User accounts</span>
        <span class="count" id="user-count">0</span>
      </p>
      <div class="admin-list" id="user-list"></div>
    </section>

    <section class="admin-section">
      <p class="admin-section-title">
        <span>Recent activity</span>
        <span class="count" id="activity-count">0</span>
      </p>
      <div class="activity-feed" id="activity-feed"></div>
    </section>

  </div>
</div>

<footer class="site-footer">
  <div class="shell">BAMS — Final Year Project, MIT-PR01 · SEU/IS/21/MIT/151</div>
</footer>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/header.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
